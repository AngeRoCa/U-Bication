<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Piso 1 - Facultad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">← Volver</a>
    <h2>Piso 1</h2>
  </header>

  <main class="map-wrapper">

    <div class="route-card">

      <div class="route-row">
        <label for="fromSelect">Desde:</label>
        <select id="fromSelect">
          <option value="">Selecciona un aula</option>
        </select>
      </div>

      <div class="route-row">
        <label for="toSelect">Hasta:</label>
        <select id="toSelect">
          <option value="">Selecciona un aula</option>
        </select>
      </div>

      <button id="generateRouteBtn">Generar ruta</button>

    </div>


    <div id="mapContainer" class="map-container" data-floor="1">
      <img src="img/piso 1.png" alt="Plano primer piso" class="map-image">
    </div>
  </main>


  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeModal" class="modal-close" aria-label="Cerrar">✕</button>
      <div id="modalBody" class="modal-body">
        <!-- Solo nombre del aula (opción 1) -->
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
