<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Piso 3 - Facultad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">← Volver</a>
    <h2>Piso 3</h2>
    <div class="search">
      <input id="searchInput" placeholder="Buscar aula (ej: INFO 01 o DECANATURA)" />
      <button id="searchBtn">Buscar</button>
    </div>

    <div class="route-selector">
      <label for="fromSelect">Desde:</label>
      <select id="fromSelect">
        <option value="">Selecciona un aula</option>
      </select>
    
      <label for="toSelect">Hasta:</label>
      <select id="toSelect">
        <option value="">Selecciona un aula</option>
      </select>
    
      <button id="generateRouteBtn">Generar ruta</button>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="mapContainer" class="map-container" data-floor="3">
      <img src="img/piso 3.png" alt="Plano segundo piso" class="map-image">
    </div>
  </main>
<a href="https://docs.google.com/forms/d/e/1FAIpQLSdh581Pj8z3fRSzS4mF226SVUNzA5Vv_MhmHafCi_qDlXrNWw/viewform?usp=sharing&ouid=100393325558157245809" target="_blank">Ir a encuesta de satisfacción</a>
  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeModal" class="modal-close" aria-label="Cerrar">✕</button>
      <div id="modalBody" class="modal-body">
        <!-- Solo nombre del aula -->
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
