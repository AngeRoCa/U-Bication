<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa - Interactivo</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <main class="container">
    
    <img src="img/Recurso 2.png" alt="Logo" class="logo">

    <h1 class="titulo">Mapa - Interactivo</h1>
    <p class="sub">Selecciona un piso</p>

    <nav class="menu">
      <a class="btn" href="piso1.html">Primer piso</a>
      <a class="btn" href="piso2.html">Segundo piso</a>
      <a class="btn" href="piso3.html">Tercer piso</a>
    </nav>

    <small class="hint">Mapas responsive. Busca por número o nombre de aula.</small>
  </main>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        playRouteAudio('1i');
    });

    function playRouteAudio(key) {

        const audioPath =`audios/${key}.wav`
        const audio = new Audio(audioPath);

        if(window.currentAudio && !window.currentAudio.paused){
            window.currentAudio.pause();
        }

        window.currentAudio = audio;
        audio.play().catch(err => {
            console.warn("No se pudo reproducir el audio: ", err);
        });
    }
</script>
</body>

</html>
